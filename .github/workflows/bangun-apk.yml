name: Bangun APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  bangun:
    name: Kompilasi APK
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          shopt -s nullglob
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z"
          done

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Pasang platform Android
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Kompilasi APK Android
        run: |
          GDIR=$(find . -maxdepth 4 \( -name "settings.gradle*" -o -name "build.gradle*" \) ! -path "*/build/*" | head -n 1)
          [ -n "$GDIR" ] && cd "$(dirname "$GDIR")"
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon -x lint -x test

      - name: Siapkan berkas APK
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          test -n "$APK_PATH" || { echo "Berkas APK tidak ditemukan!"; exit 1; }
          cp "$APK_PATH" "percakapan-suara-dua-arah-v${{ github.run_number }}.apk"

      - name: Simpan Artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-percakapan-suara-dua-arah-${{ github.run_number }}
          path: "percakapan-suara-dua-arah-v${{ github.run_number }}.apk"

      - name: Terbitkan ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versi v${{ github.run_number }}
          generate_release_notes: false
          files: "percakapan-suara-dua-arah-v${{ github.run_number }}.apk"